# One Compose file for the laptop and the 1 CPU / 1 GB VM. Memory limits follow spec section 14
# (about 530 MB in total, leaving ~300 MB for the OS and the Docker daemon).
#   docker compose up -d --build              # postgres, redis, app, worker
#   docker compose --profile tls up -d        # + caddy for TLS (needs DOMAIN in .env)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@postgres:5432/${POSTGRES_DB:-metering}
  REDIS_URL: redis://redis:6379/0
  INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-change-me}
  OPERATOR_EMAILS: ${OPERATOR_EMAILS:-operator@demo.example}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metering} -d ${POSTGRES_DB:-metering}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: the stream, sessions and counters must never be silently evicted.
    command: ["redis-server", "--maxmemory", "40mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: metering-app:latest
    restart: unless-stopped
    environment: *app-env
    volumes:
      - objects:/data/objects
      - spool:/data/spool
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  worker:
    image: metering-app:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker_main"]
    environment:
      <<: *app-env
      CONSUMER_NAME: worker-1
    depends_on:
      app:
        condition: service_healthy   # migrations run in the app container at startup
    mem_limit: 96m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    mem_limit: 32m
    logging: *logging

volumes:
  pgdata:
  redisdata:
  objects:
  spool:
  caddydata:
